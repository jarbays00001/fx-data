name: Fetch candles

on:
  schedule:
    # Cadangan. Pemicu utama: cron-job.org (workflow_dispatch tiap jam, menit 5).
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Kirim pesan tes ke Telegram saja (tanpa unduh data)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-candles
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Tes Telegram
        if: ${{ inputs.test }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secret TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID belum diisi."; exit 1
          fi
          R=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Tes notifikasi fx-data berhasil. Bot siap mengirim setup.")
          echo "$R" | grep -q '"ok":true' && echo "Terkirim." || { echo "Gagal kirim: $R" | sed "s/${TELEGRAM_BOT_TOKEN}/***/g"; exit 1; }

      - name: Unduh data
        if: ${{ !inputs.test }}
        run: python3 fetch_data.py data

      - name: Commit data
        if: ${{ !inputs.test }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: update candle $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Scan setup
        if: ${{ !inputs.test }}
        run: python3 scanner.py data out

      - name: Kirim Telegram
        if: ${{ !inputs.test }}
        run: |
          if [ ! -s out/message.txt ]; then
            echo "Tidak ada setup/watchlist baru. Tidak ada pesan."
            mkdir -p state && cp out/state_new.json state/sent.json
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secret Telegram belum diisi. Pesan tidak dikirim."; exit 0
          fi
          R=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@out/message.txt")
          if echo "$R" | grep -q '"ok":true'; then
            echo "Terkirim."
            mkdir -p state && cp out/state_new.json state/sent.json
          else
            echo "Gagal kirim Telegram."; exit 1
          fi

      - name: Commit state
        if: ${{ !inputs.test }}
        run: |
          git add state
          if git diff --cached --quiet; then
            echo "State tidak berubah."
          else
            git commit -m "state: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
          
